<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statystyka</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$']],
    displayMath: [['$$', '$$']],
    processEscapes: true
  },
  options: { skipHtmlTags: ['script','noscript','style','textarea','pre'] }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-chtml.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/r.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0f1117;
    --surface: #161b27;
    --surface2: #1e2535;
    --border: #2a3347;
    --accent: #5b8af5;
    --accent2: #a78bfa;
    --text: #d4daf0;
    --text-muted: #7585a8;
    --text-dim: #4a5878;
    --heading: #eef2ff;
    --code-bg: #1a1f2e;
    --math-color: #c4d4ff;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    line-height: 1.75;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 1rem 2rem;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .logo {
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    color: var(--accent);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .logo span { color: var(--accent2); }

  #doc-title {
    font-size: 0.85rem;
    color: var(--text-muted);
    background: var(--surface2);
    padding: 0.3rem 0.8rem;
    border-radius: 20px;
    font-family: 'JetBrains Mono', monospace;
  }

  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 2.5rem 2rem 6rem;
  }

  /* Loading / error */
  #status {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text-muted);
    font-size: 1rem;
  }
  #status.error { color: #f87171; }

  /* ── Rendered Markdown ── */
  #rendered {
    font-family: 'Crimson Pro', Georgia, serif;
    font-size: 1.15rem;
    line-height: 1.85;
    color: var(--text);
  }

  #rendered h1, #rendered h2, #rendered h3,
  #rendered h4, #rendered h5, #rendered h6 {
    font-family: 'Outfit', sans-serif;
    color: var(--heading);
    margin-top: 2.2rem;
    margin-bottom: 0.7rem;
    line-height: 1.3;
  }
  #rendered h1 { font-size: 2rem; font-weight: 600; border-bottom: 2px solid var(--accent); padding-bottom: 0.4rem; }
  #rendered h2 { font-size: 1.55rem; font-weight: 600; }
  #rendered h3 { font-size: 1.2rem; font-weight: 500; color: var(--accent2); }
  #rendered h4 { font-size: 1rem; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

  #rendered p { margin-bottom: 1rem; }

  #rendered ul, #rendered ol { padding-left: 1.6rem; margin-bottom: 1rem; }
  #rendered li { margin-bottom: 0.35rem; }
  #rendered li::marker { color: var(--accent); }

  #rendered strong { font-weight: 600; color: var(--heading); }
  #rendered em { font-style: italic; color: var(--accent2); }

  #rendered a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  #rendered a:hover { color: var(--accent2); }

  #rendered hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 2.5rem 0;
  }

  #rendered blockquote {
    border-left: 3px solid var(--accent);
    padding: 0.8rem 1.2rem;
    margin: 1.2rem 0;
    background: var(--surface);
    border-radius: 0 8px 8px 0;
    color: var(--text-muted);
    font-style: italic;
  }

  #rendered code:not(.hljs) {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.83em;
    background: var(--code-bg);
    color: #a78bfa;
    padding: 0.15em 0.45em;
    border-radius: 4px;
    border: 1px solid var(--border);
  }

  #rendered pre {
    background: var(--code-bg) !important;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.2rem 1.4rem;
    overflow-x: auto;
    margin: 1.2rem 0;
    position: relative;
  }
  #rendered pre code {
    font-family: 'JetBrains Mono', monospace !important;
    font-size: 0.85rem !important;
    background: transparent !important;
    border: none !important;
    padding: 0 !important;
  }

  .lang-badge {
    position: absolute;
    top: 0.5rem;
    right: 0.7rem;
    font-family: 'Outfit', sans-serif;
    font-size: 0.68rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    background: var(--surface2);
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
  }

  mjx-container { color: var(--math-color) !important; overflow-x: auto; }
  mjx-container[display="true"] {
    margin: 1.4rem 0 !important;
    padding: 1rem;
    background: var(--surface);
    border-left: 3px solid var(--accent2);
    border-radius: 0 8px 8px 0;
  }

  #rendered table { width: 100%; border-collapse: collapse; margin: 1.2rem 0; font-size: 0.9em; }
  #rendered th { background: var(--surface2); color: var(--heading); padding: 0.6rem 1rem; text-align: left; border-bottom: 2px solid var(--accent); font-family: 'Outfit', sans-serif; font-weight: 500; }
  #rendered td { padding: 0.55rem 1rem; border-bottom: 1px solid var(--border); }
  #rendered tr:hover td { background: var(--surface); }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  #rendered { animation: fadeIn 0.35s ease; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div class="logo">MD<span>·</span>Viewer</div>
  <span id="doc-title">Statystyka.md</span>
</header>

<main>
  <div id="status">Ładowanie…</div>
  <div id="rendered" style="display:none"></div>
</main>

<script>
  const FILE = 'Statystyka.md';

  const renderer = new marked.Renderer();
  renderer.code = (code, lang) => {
    const validLang = lang && hljs.getLanguage(lang) ? lang : 'plaintext';
    const highlighted = hljs.highlight(code, { language: validLang }).value;
    const badge = lang ? `<span class="lang-badge">${lang}</span>` : '';
    return `<pre>${badge}<code class="hljs language-${validLang}">${highlighted}</code></pre>`;
  };
  marked.use({ breaks: false, gfm: true, renderer });

  function protectMath(src) {
    return src
      .replace(/\$\$([\s\S]*?)\$\$/g, (_, m) => `\x00D\x00${btoa(unescape(encodeURIComponent(m)))}\x00`)
      .replace(/\$([^\n$]+?)\$/g,     (_, m) => `\x00I\x00${btoa(unescape(encodeURIComponent(m)))}\x00`);
  }
  function restoreMath(html) {
    return html
      .replace(/\x00D\x00([A-Za-z0-9+/=]+)\x00/g, (_, b) => `$$${decodeURIComponent(escape(atob(b)))}$$`)
      .replace(/\x00I\x00([A-Za-z0-9+/=]+)\x00/g,  (_, b) => `$${decodeURIComponent(escape(atob(b)))}$`);
  }

  async function load() {
    const status   = document.getElementById('status');
    const rendered = document.getElementById('rendered');

    try {
      const res = await fetch(FILE);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const src  = await res.text();
      const html = restoreMath(marked.parse(protectMath(src)));

      rendered.innerHTML = html;
      status.style.display  = 'none';
      rendered.style.display = 'block';

      if (window.MathJax?.typesetPromise) {
        await MathJax.typesetPromise([rendered]);
      }
    } catch (err) {
      status.textContent = `Nie udało się wczytać pliku „${FILE}": ${err.message}`;
      status.classList.add('error');
    }
  }

  load();
</script>
</body>
</html>
